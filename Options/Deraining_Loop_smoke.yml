# Two-iteration configuration used to verify the complete training path on one GPU.
name: debug_Deraining_LoopDRSformer_smoke
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/train/Rain200H/target
    dataroot_lq: ./Datasets/train/Rain200H/input
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    mini_batch_sizes: [1]
    iters: [2]
    gt_size: 32
    gt_sizes: [32]
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_g:
  type: LoopDRSformer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  latent_pre_blocks: 1
  latent_shared_blocks: 2
  latent_post_blocks: 1
  max_loops: 4
  train_loop_range: [2, 4]
  loop_embedding: true
  input_injection: true
  layer_scale_init: 0.1
  intermediate_supervision: true
  dynamic_tksa: false
  rain_gate: false
  adaptive_exit: false

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

train:
  total_iter: 2
  warmup_iter: -1
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [2]
    restart_weights: [1]
    eta_mins: [0.000001]
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
  intermediate_weights: [0.1, 0.2, 0.4, 1.0]

logger:
  print_freq: 1
  save_checkpoint_freq: 100
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
