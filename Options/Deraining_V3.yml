# Quality-first recurrent model: post-latent capacity, deep supervision, EMA.
name: Deraining_LoopDRSformerV3
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/train/Rain200H/target
    dataroot_lq: ./Datasets/train/Rain200H/input
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 1
    batch_size_per_gpu: 4
    mini_batch_sizes: [4]
    iters: [300000]
    gt_size: 128
    gt_sizes: [128]
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/test/Rain200H/target
    dataroot_lq: ./Datasets/test/Rain200H/input
    io_backend:
      type: disk

network_g:
  type: LoopDRSformerV3
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  latent_pre_blocks: 1
  latent_shared_blocks: 4
  # Restore unique late-stage capacity while retaining a lower parameter
  # count than the original eight-block DRSformer latent stage.
  latent_post_blocks: 2
  max_loops: 2
  train_loop_range: [2, 2]
  loop_embedding: true
  loop_adapters: true
  input_injection: true
  layer_scale_init: 0.1
  intermediate_supervision: true
  dynamic_tksa: true
  rain_gate: true
  adaptive_exit: false

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

train:
  total_iter: 300000
  warmup_iter: -1
  ema_decay: 0.999
  # The first recurrent result is useful training guidance but the final
  # decoder output remains the primary objective.
  intermediate_weights: [0.1, 1.0]
  use_grad_clip: true
  grad_clip_norm: 1.0
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

val:
  window_size: 8
  val_freq: !!float 1e4
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 1
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true

logger:
  print_freq: 100
  # Ten-thousand-step checkpoints avoid the disk exhaustion caused by the
  # previous one-thousand-step retention policy.
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
