# Low-cost quality recovery from the completed V3 EMA checkpoint.
name: Deraining_LoopDRSformerV3_LargePatchFT
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/train/Rain200H/target
    dataroot_lq: ./Datasets/train/Rain200H/input
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 1
    batch_size_per_gpu: 2
    mini_batch_sizes: [2, 1]
    iters: [30000, 20000]
    gt_size: 192
    gt_sizes: [160, 192]
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/test/Rain200H/target
    dataroot_lq: ./Datasets/test/Rain200H/input
    io_backend:
      type: disk

network_g:
  type: LoopDRSformerV3
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  latent_pre_blocks: 1
  latent_shared_blocks: 4
  latent_post_blocks: 2
  max_loops: 2
  train_loop_range: [2, 2]
  loop_embedding: true
  loop_adapters: true
  input_injection: true
  layer_scale_init: 0.1
  # The auxiliary head has finished its job during the original 300k run.
  intermediate_supervision: false
  dynamic_tksa: true
  rain_gate: true
  adaptive_exit: false

path:
  # Change this only if your V3 experiment directory has a different name.
  pretrain_network_g: ./experiments/Deraining_LoopDRSformerV3/models/net_g_latest.pth
  param_key: params_ema
  ema_param_key: params_ema
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 50000
  warmup_iter: -1
  ema_decay: 0.9999
  use_grad_clip: true
  grad_clip_norm: 1.0
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [50000]
    restart_weights: [1]
    eta_mins: [0.0000001]
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 2e-5
    weight_decay: !!float 1e-5
    betas: [0.9, 0.999]
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

val:
  window_size: 8
  val_freq: 2500
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 1
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
